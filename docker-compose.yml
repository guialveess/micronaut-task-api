services:
  postgres:
    image: postgres:16
    container_name: pg-tarefas
    restart: unless-stopped
    environment:
      POSTGRES_DB: tarefas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tarefas"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: