micronaut:
  application:
    name: micronaut-task-api
  router:
    static-resources:
      swagger:
        paths: classpath:META-INF/swagger
        mapping: /swagger/**
      swagger-ui:
        paths: classpath:META-INF/swagger/views/swagger-ui
        mapping: /swagger-ui/**
      scalar:
        paths: classpath:META-INF/swagger/views/scalar
        mapping: /scalar/**
datasources:
  default:
    url: ${JDBC_URL:`jdbc:postgresql://localhost:5432/tarefas`}
    username: ${JDBC_USER:postgres}
    password: ${JDBC_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    db-type: postgres
    dialect: POSTGRES
flyway:
  datasources:
    default:
      enabled: true